<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 Happy Birthday Subrto 🎉</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    text-align: center;
    overflow: hidden;
  }
  img {
    max-width: 80%;
    max-height: 70vh;
    border-radius: 20px;
    box-shadow: 0 0 30px #fff;
    animation: glow 2s infinite alternate;
  }
  @keyframes glow {
    0% { box-shadow: 0 0 20px red; }
    50% { box-shadow: 0 0 20px blue; }
    100% { box-shadow: 0 0 20px green; }
  }
  #message {
    font-size: 1.5rem;
    margin: 20px;
  }
  #nextBtn, #giftBtn {
    background: linear-gradient(45deg, red, blue, green);
    color: white;
    border: none;
    padding: 15px 25px;
    font-size: 1.2rem;
    cursor: pointer;
    border-radius: 10px;
    margin-top: 20px;
    animation: rgbBtn 2s infinite alternate;
  }
  @keyframes rgbBtn {
    0% { background: red; }
    50% { background: blue; }
    100% { background: green; }
  }
  .balloon {
    position: absolute;
    font-size: 3rem;
    animation: float 5s linear infinite;
  }
  @keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body onclick="startMusic()">

<h1>🎉 শুভ জন্মদিন Subrto Mahato 🎉</h1>

<!-- ব্যাকগ্রাউন্ড মিউজিক -->
<audio id="bgm" autoplay loop>
  <source src="G.m4a" type="audio/mp4">
</audio>

<!-- Main photo and message -->
<img id="photo" src="A.jpg" alt="Birthday Photo">
<div id="message">তোমার জন্মদিনে রইলো অনেক শুভেচ্ছা ও ভালোবাসা 💖</div>

<!-- Buttons -->
<button id="nextBtn" onclick="nextSlide()">👉 Click</button>
<button id="giftBtn" onclick="showGift()" style="display:none;">🎁 Gift</button>

<script>
const photos = ["A.jpg","B.jpg","C.jpg","D.jpg","E.jpg"];
const messages = [
  "তোমার জন্মদিনে রইলো অনেক শুভেচ্ছা ও ভালোবাসা 💖",
  "তোমার জীবন হোক আনন্দে ভরা 🌟",
  "তুমি অনেক দূর এগিয়ে যাও 🎓✨",
  "সাফল্য সবসময় তোমার সাথী হোক 🌈",
  "Happy Birthday 🎂🎉"
];
let current = 0;
let musicStarted = false;

function nextSlide(){
  current++;
  if(current < photos.length){
    document.getElementById('photo').src = photos[current];
    document.getElementById('message').innerText = messages[current];
    if(current === photos.length - 1){
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('giftBtn').style.display = 'inline-block';
    }
  }
}

function showGift(){
  document.getElementById('photo').src = "A.jpg"; // প্রথম ছবি আবার দেখাবে
  document.getElementById('message').innerHTML = "🎉 Happy Birthday Subrto Mahato 🎉<br>বয়স: 18 Years<br>🎂🎈";
  for(let i=0; i<20; i++){
    createBalloon();
  }
}

function createBalloon(){
  const balloon = document.createElement('div');
  balloon.className = 'balloon';
  balloon.style.left = Math.random()*100 + "vw";
  balloon.style.animationDuration = 3 + Math.random()*5 + "s";
  balloon.innerText = "🎈";
  document.body.appendChild(balloon);
  setTimeout(()=>balloon.remove(),8000);
}

function startMusic() {
  if(!musicStarted){
    document.getElementById('bgm').play();
    musicStarted = true;
  }
}
</script>

</body>
</html>
